name: Monitor OLX

on:
  schedule:
    - cron: '0 * * * *' # Executa a cada 1 hora
  workflow_dispatch: # Adiciona um botão no GitHub para rodar manualmente

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Configurar ecrã virtual e executar script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          sudo apt-get install -y xvfb
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" python scraper.py

      - name: Guardar histórico no repositório
        run: |
          git config --global user.name "Bot Monitor"
          git config --global user.email "bot@monitor.com"
          git add anuncios_vistos.json
          git commit -m "Atualiza anúncios vistos" || echo "Nenhum anúncio novo para guardar"
          git push